name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Piso declarado em setup.py (python_requires=">=3.10").
          - python-version: "3.10"
            toxenv: django5-py310
          # Alvo do ecossistema OnyxERP. Testar as duas pontas é o que
          # sustenta a faixa que o pacote promete.
          - python-version: "3.13"
            toxenv: django5-py313
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala o tox
        run: python -m pip install --upgrade pip tox

      - name: Roda a suíte
        run: tox -e ${{ matrix.toxenv }}

  # Informativo, de propósito: hoje o `black --check` reprova em 21 dos 32
  # arquivos. Como gate obrigatório, deixaria o CI vermelho desde o primeiro
  # dia — e CI cronicamente vermelho é CI que ninguém lê.
  #
  # A formatação deve ser feita num commit próprio e isolado, de preferência
  # depois de haver testes cobrindo o router. Quando isso acontecer, remova o
  # `continue-on-error` abaixo e este comentário.
  lint:
    name: black + flake8 (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instala o tox
        run: python -m pip install --upgrade pip tox

      - name: Roda black e flake8
        run: tox -e flake8
