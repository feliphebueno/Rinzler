[tox]
envlist =
    django{5}-py{310}

[testenv]
install_command =
    pip install -v -v -v {opts} {packages}

use_frozen_constraints=true
constrain_package_deps=true
deps =
    {[base]deps}
    django5: django~=5.2
commands =
    pytest
setenv =
    PYTHONPATH={toxinidir}
    HOME={env:HOME:/home/runner}

[base]
deps =
    -r{toxinidir}/requirements.txt

[testenv:flake8]
passenv = TERM
deps =
    black
    flake8
commands =
    black --check .
    flake8
